<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE6B2" />
      <stop offset="50%" stop-color="#E1B863" />
      <stop offset="100%" stop-color="#B88F3C" />
    </linearGradient>

    <!-- Soft Golden Outer Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glowAlpha">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glowAlpha"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(40, 20)">
    <!-- Shopping Cart Icon -->
    <g transform="translate(0, 15) scale(0.95)" stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Wheels -->
      <circle cx="28" cy="86" r="5" stroke-width="3" fill="none"/>
      <circle cx="72" cy="86" r="5" stroke-width="3" fill="none"/>
      <!-- Basket Structure -->
      <path d="M 0 10 L 15 10 L 32 72 L 80 72 L 92 28 L 20 28" stroke-width="4"/>
      <!-- Grid Overlay -->
      <line x1="24" y1="43" x2="88" y2="43" stroke-width="2"/>
      <line x1="28" y1="58" x2="84" y2="58" stroke-width="2"/>
      <line x1="38" y1="28" x2="44" y2="72" stroke-width="2"/>
      <line x1="56" y1="28" x2="58" y2="72" stroke-width="2"/>
      <line x1="74" y1="28" x2="72" y2="72" stroke-width="2"/>
      <!-- Swoosh Arrow inside Cart -->
      <path d="M 28 62 Q 55 50 78 22" stroke="url(#goldGradient)" stroke-width="4"/>
      <polygon points="78,20 68,24 75,32" fill="url(#goldGradient)"/>
    </g>

    <!-- Glitter Particles -->
    <g fill="#FCE6B2" filter="url(#goldGlow)">
      <circle cx="75" cy="18" r="2.5"/>
      <circle cx="88" cy="8" r="1.5"/>
      <circle cx="68" cy="5" r="1.5"/>
      <circle cx="82" cy="28" r="1.2"/>
    </g>

    <!-- Brand Typography -->
    <text 
      x="125" 
      y="82" 
      font-family="'Montserrat', 'Arial Black', sans-serif" 
      font-weight="900" 
      font-size="76" 
      letter-spacing="-3" 
      fill="url(#goldGradient)" 
      filter="url(#goldGlow)"
    >CopyCart</text>
  </g>
</svg>
