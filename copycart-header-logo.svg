<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 100" width="100%" height="100%">
    <defs>
        <!-- Gold Gradient Fill -->
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F9E4B7" />
            <stop offset="50%" stop-color="#DFBA67" />
            <stop offset="100%" stop-color="#9E7D3B" />
        </linearGradient>

        <!-- Outer Gold Glow Filter -->
        <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComponentTransfer in="blur" result="glow1">
                <feFuncA type="linear" slope="0.8"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode in="glow1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Embedded CSS for Typography -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;display=swap');
        
        .logo-text {
            font-family: 'Montserrat', 'Arial Black', sans-serif;
            font-weight: 900;
            font-size: 76px;
            letter-spacing: -3px;
            fill: url(#goldGradient);
            filter: url(#goldGlow);
        }
    </style>

    <!-- Main CopyCart Logo Text -->
    <text 
        x="50%" 
        y="55%" 
        dominant-baseline="middle" 
        text-anchor="middle"
        class="logo-text">
        CopyCart
    </text>
</svg>
